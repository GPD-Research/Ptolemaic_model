[project]
name = "ptolemaic-model"
version = "0.1.0"
description = "A kinematic model of the Ptolemaic geocentric universe"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "black>=24.0",
    "pre-commit>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
